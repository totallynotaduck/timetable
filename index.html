<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; color: #333; }

/* Auth screen */
.auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a73e8 0%, #6a4cff 100%); }
.auth-card { background: white; border-radius: 16px; padding: 32px; width: 360px; max-width: 92vw; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
.auth-card h2 { font-size: 22px; margin-bottom: 4px; color: #1a73e8; }
.auth-card .sub { font-size: 13px; color: #888; margin-bottom: 20px; }
.auth-card label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; }
.auth-card input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
.auth-card button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #1a73e8; color: white; font-size: 15px; cursor: pointer; }
.auth-card button:hover { background: #1666d6; }
.auth-card .switch { text-align: center; margin-top: 14px; font-size: 13px; color: #666; }
.auth-card .switch a { color: #1a73e8; cursor: pointer; text-decoration: none; }
.auth-card .msg { font-size: 13px; margin-bottom: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
.auth-card .msg.err { display: block; background: #fce8e6; color: #d93025; }
.auth-card .msg.ok { display: block; background: #e6f4ea; color: #188038; }

/* Header */
.header { background: #1a73e8; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; font-weight: 500; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-controls { display: flex; align-items: center; gap: 12px; }
.header-controls button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.header-controls button:hover { background: rgba(255,255,255,0.35); }
.header-controls .month-display { font-size: 18px; min-width: 140px; text-align: center; font-weight: 500; }
.user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.user-info button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.user-info button:hover { background: rgba(255,255,255,0.35); }

/* Main */
.main { max-width: 1400px; margin: 24px auto; padding: 0 16px; }
.week-nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.week-nav button { background: white; border: 1px solid #ddd; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
.week-nav button:hover { border-color: #1a73e8; color: #1a73e8; }
.week-nav button.active { background: #1a73e8; color: white; border-color: #1a73e8; }

.table-wrap { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
table { width: 100%; border-collapse: collapse; }
th { background: #f8f9fa; padding: 12px 8px; font-size: 13px; color: #666; border-bottom: 2px solid #e0e0e0; text-align: center; font-weight: 500; }
td { border: 1px solid #e8e8e8; vertical-align: top; height: 100px; width: 12.5%; }
.time-col { width: 60px; text-align: center; font-size: 12px; color: #999; background: #fafafa; vertical-align: middle; }

.event { background: #e8f0fe; color: #1a73e8; margin: 3px; padding: 4px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; border-left: 3px solid #1a73e8; overflow: hidden; position: relative; }
.event:hover { filter: brightness(0.95); }
.event.is-recurring::after { content: "⟳"; position: absolute; top: 3px; right: 6px; font-size: 12px; opacity: 0.5; }
.ev-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-note { color: #666; font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event.color-1 { background: #e8f0fe; border-left-color: #1a73e8; color: #1a73e8; }
.event.color-2 { background: #fce8e6; border-left-color: #d93025; color: #d93025; }
.event.color-3 { background: #e6f4ea; border-left-color: #188038; color: #188038; }
.event.color-4 { background: #fef7e0; border-left-color: #f9ab00; color: #e37400; }
.event.color-5 { background: #f3e8fd; border-left-color: #9334e8; color: #9334e8; }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: white; border-radius: 12px; padding: 24px; width: 460px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 18px; margin-bottom: 16px; color: #1a73e8; }
.modal label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
.modal textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.modal-actions button { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
.btn-save { background: #1a73e8; color: white; }
.btn-cancel { background: #f0f0f0; color: #333; }
.btn-delete { background: #d93025; color: white; }
.btn-delete-soft { background: #f9ab00; color: white; }

.recurring-section { margin-top: 8px; border-top: 1px solid #eee; padding-top: 12px; }
.recurring-section .section-label { font-size: 14px; color: #333; font-weight: 500; margin-bottom: 8px; display: block; }
.recurring-options { display: none; margin-top: 8px; }
.recurring-options.visible { display: block; }
.day-checkboxes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.day-checkboxes label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #333; background: #f5f5f5; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.day-checkboxes input[type="checkbox"] { width: auto; margin: 0; }
.end-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.end-row input, .end-row select { margin-bottom: 0; }
.hidden { display: none !important; }
.loading-bar { position: fixed; top: 0; left: 0; height: 3px; background: #1a73e8; transition: width 0.3s; z-index: 999; }
</style>
</head>
<body>

<!-- Auth screen -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h2>📅 日程表</h2>
    <div class="sub" id="authSub">登录以在多设备间同步你的日程</div>
    <div class="msg" id="authMsg"></div>
    <form id="authForm" onsubmit="return submitAuth(event)">
      <label>用户名</label>
      <input type="text" id="authUser" autocomplete="username" placeholder="用户名" required>
      <label>密码</label>
      <input type="password" id="authPass" autocomplete="current-password" placeholder="密码（至少 4 位）" required>
      <button type="submit" id="authSubmit">登录</button>
    </form>
    <div class="switch">
      <span id="authSwitchText">还没有账号？</span>
      <a id="authSwitch" onclick="toggleAuthMode()">注册新账号</a>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="appScreen" style="display:none">
  <div class="header">
    <h1>📅 日程表</h1>
    <div class="header-right">
      <div class="header-controls">
        <button onclick="changeMonth(-1)">◀ 上一月</button>
        <span class="month-display" id="monthDisplay"></span>
        <button onclick="changeMonth(1)">下一月 ▶</button>
      </div>
      <span class="sync-status" id="syncStatus"></span>
      <div class="user-info">
        <span id="userName"></span>
        <button onclick="logout()">退出</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="week-nav" id="weekNav"></div>
    <div class="table-wrap">
      <table id="timetable"></table>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="loading-bar" id="loadingBar" style="width:0"></div>

<script>
// --- API base URL -----------------------------------------------------------
// Set this to your deployed Vercel API (e.g. https://timetable-api.vercel.app)
// You can override it by adding <meta name="api-base" content="..."> before this script.
const API = (document.querySelector('meta[name="api-base"]') || {}).content
  || window.API_BASE
  || 'https://timetable-api.vercel.app';

let authToken = localStorage.getItem('tt_token') || '';
let authUser = localStorage.getItem('tt_user') || '';
let authMode = 'login'; // 'login' | 'register'
let localMode = false;  // true when no cloud API is reachable/booted

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedWeek = 0;
let events = [];
let dirty = false;
let syncTimer = null;

const timeSlots = [];
for (let h = 6; h <= 22; h++) {
  timeSlots.push(`${String(h).padStart(2, '0')}:00`);
  if (h < 22) timeSlots.push(`${String(h).padStart(2, '0')}:30`);
}

function showLoading(pct) { document.getElementById('loadingBar').style.width = pct + '%'; }
function hideLoading() { document.getElementById('loadingBar').style.width = '0'; }

function setSync(text) { document.getElementById('syncStatus').textContent = text; }

// --- Fetch helper with auth -------------------------------------------------
async function apiFetch(path, opts = {}) {
  opts.headers = Object.assign({
    'Content-Type': 'application/json',
    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
  }, opts.headers || {});
  const res = await fetch(`${API}${path}`, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  return { res, data };
}

// --- Auth UI ----------------------------------------------------------------
function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('authSubmit').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('authSwitchText').textContent = authMode === 'login' ? '还没有账号？' : '已经有账号？';
  document.getElementById('authSwitch').textContent = authMode === 'login' ? '注册新账号' : '去登录';
  document.getElementById('authSub').textContent = authMode === 'login' ? '登录以在多设备间同步你的日程' : '创建一个账号，日程将保存在云端并跨设备同步';
  showAuthMsg('', '');
}
function showAuthMsg(text, kind) {
  const el = document.getElementById('authMsg');
  el.className = 'msg' + (kind ? ' ' + kind : '');
  el.textContent = text;
}

async function submitAuth(event) {
  event.preventDefault();
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  if (!username || !password) { showAuthMsg('请填写用户名和密码', 'err'); return false; }
  showAuthMsg('正在连接服务器...', '');
  try {
    const { res, data } = await apiFetch(`/${authMode}`, {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    if (data.ok) {
      authToken = data.token;
      authUser = data.username;
      localStorage.setItem('tt_token', authToken);
      localStorage.setItem('tt_user', authUser);
      showAuthMsg('登录成功，正在加载日程...', 'ok');
      await enterApp();
    } else {
      showAuthMsg(data.message || '操作失败', 'err');
    }
  } catch (e) {
    // No reachable cloud API: fall back to a local, single-device account so
    // the app still opens. Sync will activate once API is configured.
    localMode = true;
    authUser = username;
    localStorage.setItem('tt_user', authUser);
    showAuthMsg('已离线登录（仅本机保存，未同步云端）。配置 API 后可多设备同步。', 'ok');
    await enterApp();
  }
  return false;
}

async function logout() {
  if (authToken && !localMode) {
    try { await apiFetch('/logout', { method: 'POST' }); } catch {}
  }
  authToken = ''; authUser = ''; localMode = false;
  localStorage.removeItem('tt_token');
  localStorage.removeItem('tt_user');
  localStorage.removeItem('timetable_events');
  events = [];
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  showAuthMsg('', '');
}

async function verifySession() {
  if (!authToken) return false;
  if (localMode) return true;
  const { res, data } = await apiFetch('/verify', { method: 'GET' });
  if (data.ok) {
    authUser = data.username;
    localStorage.setItem('tt_user', authUser);
    return true;
  }
  // token invalid -> clear
  authToken = ''; authUser = '';
  localStorage.removeItem('tt_token');
  localStorage.removeItem('tt_user');
  return false;
}

// --- App --------------------------------------------------------------------
function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userName').textContent = authUser;
  renderAll();
  syncTimer = setInterval(async () => {
    if (dirty) { await syncSave(); dirty = false; }
  }, 10000);
}

async function enterApp() {
  showApp();
  await syncLoad();
}

async function syncLoad() {
  if (localMode) {
    events = JSON.parse(localStorage.getItem('timetable_events') || '[]');
    setSync('⚠ 未连接云端');
    renderTable();
    return;
  }
  showLoading(30);
  try {
    const { data } = await apiFetch('/events', { method: 'GET' });
    if (data.ok) {
      events = data.events || [];
      saveLocal();
      setSync('✓ 已同步');
    } else {
      setSync('⚠ 同步失败');
    }
    showLoading(100);
  } catch (e) {
    setSync('⚠ 离线（本地数据）');
  }
  setTimeout(hideLoading, 400);
  renderTable();
}

async function syncSave() {
  if (localMode) {
    saveLocal();
    setSync('⚠ 未连接云端');
    return;
  }
  setSync('⟳ 同步中...');
  showLoading(50);
  try {
    const { data } = await apiFetch('/events', {
      method: 'POST',
      body: JSON.stringify({ events })
    });
    setSync(data.ok ? '✓ 已同步' : '⚠ 保存失败');
  } catch (e) {
    setSync('⚠ 离线（本地数据）');
  }
  setTimeout(hideLoading, 400);
}

function saveLocal() { localStorage.setItem('timetable_events', JSON.stringify(events)); }

(async function init() {
  if (authUser && !authToken) localMode = true; // returning local-only user
  const ok = await verifySession();
  if (ok) {
    await enterApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
})();

/* --- Date helpers --- */
function getWeeksOfMonth(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const weeks = [];
  let start = new Date(firstDay);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  while (start <= lastDay || weeks.length === 0) {
    const weekEnd = new Date(start);
    weekEnd.setDate(weekEnd.getDate() + 6);
    weeks.push({ start: new Date(start), end: new Date(weekEnd) });
    start.setDate(start.getDate() + 7);
  }
  return weeks;
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* --- Recurring engine --- */
function expandTemplate(template, rangeStart, rangeEnd) {
  const results = [];
  const rec = template.recurring;
  if (!rec || rec.type === 'none') return results;
  const startDate = parseDate(template.startDate);
  const excludes = rec.excludes || [];
  function shouldExclude(d) { return excludes.includes(formatDate(d)); }

  if (rec.type === 'daily') {
    let d = new Date(startDate), count = 0;
    const end = rec.endType === 'date' ? parseDate(rec.endDate) : null;
    const limit = rec.endType === 'count' ? rec.maxCount : Infinity;
    while (count < limit && d <= rangeEnd && (!end || d <= end)) {
      if (d >= rangeStart && !shouldExclude(d)) results.push(makeInstance(template, d));
      d.setDate(d.getDate() + 1); count++;
    }
  } else if (rec.type === 'weekly') {
    let weekN = 0, total = 0;
    const end = rec.endType === 'date' ? parseDate(rec.endDate) : null;
    const limit = rec.endType === 'count' ? rec.maxCount : Infinity;
    while (total < limit && weekN <= 52) {
      let allPast = true;
      for (const dayIdx of rec.days) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + ((dayIdx - d.getDay() + 7) % 7) + weekN * 7);
        if (d > rangeEnd && (!end || d > end)) continue;
        if (d >= rangeStart && (!end || d <= end) && total < limit && !shouldExclude(d)) {
          results.push(makeInstance(template, d)); total++;
        }
        if (d >= rangeStart) allPast = false;
      }
      weekN++; if (allPast) break;
    }
  } else if (rec.type === 'biweekly') {
    let weekN = 0, total = 0;
    const end = rec.endType === 'date' ? parseDate(rec.endDate) : null;
    const limit = rec.endType === 'count' ? rec.maxCount : Infinity;
    while (total < limit && weekN <= 26) {
      let allPast = true;
      for (const dayIdx of rec.days) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + ((dayIdx - d.getDay() + 7) % 7) + weekN * 14);
        if (d >= rangeStart && (!end || d <= end) && total < limit && !shouldExclude(d)) {
          results.push(makeInstance(template, d)); total++;
        }
        if (d >= rangeStart) allPast = false;
      }
      weekN++; if (allPast) break;
    }
  } else if (rec.type === 'monthly') {
    let mOff = 0, count = 0;
    const end = rec.endType === 'date' ? parseDate(rec.endDate) : null;
    const limit = rec.endType === 'count' ? rec.maxCount : Infinity;
    while (count < limit && mOff <= 60) {
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + mOff);
      if (d >= rangeStart && (!end || d <= end) && !shouldExclude(d)) {
        results.push(makeInstance(template, d)); count++;
      }
      if (d > rangeEnd && (!end || d > end)) break;
      mOff++;
    }
  }
  return results;
}

function makeInstance(template, date) {
  return { id: template.id, groupId: template.groupId, title: template.title, date: formatDate(date), time: template.time, color: template.color, note: template.note };
}

function genId() { return 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

/* --- Render --- */
function getVisibleEvents() {
  const weeks = getWeeksOfMonth(currentYear, currentMonth);
  const firstDate = weeks[0] ? weeks[0].start : new Date(currentYear, currentMonth, 1);
  const lastDate = weeks[weeks.length - 1] ? weeks[weeks.length - 1].end : new Date(currentYear, currentMonth + 1, 0);
  const visible = [];
  for (const ev of events) {
    if (ev.recurring && ev.recurring.type !== 'none') visible.push(...expandTemplate(ev, firstDate, lastDate));
    else visible.push(ev);
  }
  return visible;
}

function renderAll() { renderMonthDisplay(); renderWeekNav(); renderTable(); }

function renderMonthDisplay() {
  document.getElementById('monthDisplay').textContent = `${currentYear}年${currentMonth + 1}月`;
}

function renderWeekNav() {
  const weeks = getWeeksOfMonth(currentYear, currentMonth);
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.textContent = `第${i+1}周 (${formatDate(w.start).slice(5)} ~ ${formatDate(w.end).slice(5)})`;
    btn.className = i === selectedWeek ? 'active' : '';
    btn.onclick = () => { selectedWeek = i; renderTable(); renderWeekNav(); };
    nav.appendChild(btn);
  });
}

function renderTable() {
  const weeks = getWeeksOfMonth(currentYear, currentMonth);
  if (selectedWeek >= weeks.length) selectedWeek = weeks.length - 1;
  const week = weeks[selectedWeek]; if (!week) return;
  const days = [];
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(week.start); d.setDate(d.getDate() + i);
    days.push({ date: d, dateStr: formatDate(d), label: `周${dayNames[d.getDay()]} ${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`, inMonth: d.getMonth() === currentMonth });
  }

  const visibleEvents = getVisibleEvents();
  const table = document.getElementById('timetable');
  let html = '<thead><tr><th style="width:60px">时间</th>';
  days.forEach(d => { html += `<th style="${d.inMonth?'':'opacity:0.3'}">${d.label}</th>`; });
  html += '</tr></thead><tbody>';

  timeSlots.forEach(t => {
    html += `<tr><td class="time-col">${t}</td>`;
    days.forEach(d => {
      const cellEvents = visibleEvents.filter(e => e.date === d.dateStr && e.time === t);
      html += `<td style="${d.inMonth?'':'opacity:0.3'}"><div class="event-list">`;
      cellEvents.forEach(ev => {
        const colorIdx = ev.color || 1;
        const isRec = !!ev.groupId;
        let cls = `event color-${colorIdx}`;
        if (isRec) cls += ' is-recurring';
        let inner = `<div class="ev-title">${ev.title}</div>`;
        if (ev.note) inner += `<div class="ev-note">${ev.note}</div>`;
        html += `<div class="${cls}" onclick="editEvent('${ev.id}', '${ev.groupId||''}', '${ev.date}')">${inner}</div>`;
      });
      html += '</div></td>';
    });
    html += '</tr>';
  });

  table.innerHTML = html + '</tbody>';

  document.querySelectorAll('td:not(.time-col)').forEach((td, idx) => {
    td.style.position = 'relative';
    td.onclick = function(e) {
      if (e.target.closest('.event')) return;
      showModal(null, days[idx % 7].date, timeSlots[Math.floor(idx / 7)]);
    };
  });
}

/* --- Modal --- */
function showModal(event, defaultDate, defaultTime) {
  const root = document.getElementById('modalRoot');
  const isEdit = !!event;
  const dateStr = event ? event.startDate || event.date : (defaultDate ? formatDate(defaultDate) : '');
  const timeVal = event ? event.time : (defaultTime || '');
  const rec = event && event.recurring ? event.recurring : { type: 'none', days: [], endType: 'date', maxCount: 10 };
  const recDays = (isEdit && event.recurring && event.recurring.days) ? event.recurring.days : rec.days || [];

  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${isEdit ? (event.recurring ? '编辑重复日程' : '编辑日程') : '添加日程'}</h2>
        <label>标题</label>
        <input type="text" id="evTitle" value="${event ? event.title : ''}" placeholder="请输入日程标题">
        <label>日期</label>
        <input type="date" id="evDate" value="${dateStr}">
        <label>时间</label>
        <select id="evTime">
          ${timeSlots.map(t => `<option value="${t}" ${t===timeVal?'selected':''}>${t}</option>`).join('')}
        </select>
        <label>颜色</label>
        <select id="evColor">
          ${[[1,'蓝色'],[2,'红色'],[3,'绿色'],[4,'黄色'],[5,'紫色']].map(([i,n]) => `<option value="${i}" ${event&&event.color==i?'selected':''}>${n}</option>`).join('')}
        </select>
        <label>备注</label>
        <textarea id="evNote" placeholder="备注信息（可选）">${event ? (event.note||'') : ''}</textarea>

        <div class="recurring-section">
          <span class="section-label">重复设置</span>
          <select id="evRecType" onchange="onRecTypeChange()">
            <option value="none" ${rec.type==='none'?'selected':''}>不重复</option>
            <option value="daily" ${rec.type==='daily'?'selected':''}>每天</option>
            <option value="weekly" ${rec.type==='weekly'?'selected':''}>每周（自选星期）</option>
            <option value="biweekly" ${rec.type==='biweekly'?'selected':''}>每两周</option>
            <option value="monthly" ${rec.type==='monthly'?'selected':''}>每月</option>
          </select>

          <div class="recurring-options ${rec.type!=='none'?'visible':''}" id="recOpts">
            <div class="day-checkboxes ${rec.type==='daily'||rec.type==='monthly'?'hidden':''}" id="dayChecks">
              ${['日','一','二','三','四','五','六'].map((name, i) => {
                const checked = recDays.includes(i) ? 'checked' : '';
                return `<label><input type="checkbox" value="${i}" ${checked}>${name}</label>`;
              }).join('')}
            </div>
            <label>结束方式</label>
            <select id="evEndType" onchange="onEndTypeChange()">
              <option value="date" ${rec.endType==='date'?'selected':''}>到指定日期</option>
              <option value="count" ${rec.endType==='count'?'selected':''}>重复指定次数</option>
            </select>
            <div class="end-row ${rec.endType==='count'?'hidden':''}" id="endDateRow">
              <input type="date" id="evEndDate" value="${rec.endDate || ''}">
            </div>
            <div class="end-row ${rec.endType!=='count'?'hidden':''}" id="endCountRow">
              <input type="number" id="evMaxCount" min="1" max="100" value="${rec.maxCount || 10}">
              <span style="font-size:13px;color:#666;white-space:nowrap">次</span>
            </div>
          </div>
        </div>

        <div class="modal-actions" style="margin-top:16px">
          ${isEdit ? `
            ${event.recurring && event.recurring.type !== 'none' ? `<button class="btn-delete" onclick="deleteGroup('${event.groupId}')">删除全部重复</button>` : ''}
            <button class="btn-delete-soft" onclick="deleteSingle('${event.id}', '${event.groupId||''}', '${event.date}')">仅删除此条</button>
          ` : ''}
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-save" onclick="saveEvent('${event ? event.id : ''}', '${event ? (event.groupId||'') : ''}', '${event ? event.date : ''}')">${isEdit ? '保存修改' : '确认添加'}</button>
        </div>
      </div>
    </div>`;
}

function onRecTypeChange() {
  const type = document.getElementById('evRecType').value;
  document.getElementById('recOpts').className = type !== 'none' ? 'recurring-options visible' : 'recurring-options';
  document.getElementById('dayChecks').className = (type === 'daily' || type === 'monthly') ? 'day-checkboxes hidden' : 'day-checkboxes';
}

function onEndTypeChange() {
  const t = document.getElementById('evEndType').value;
  document.getElementById('endDateRow').className = t === 'date' ? 'end-row' : 'end-row hidden';
  document.getElementById('endCountRow').className = t === 'count' ? 'end-row' : 'end-row hidden';
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function editEvent(id, groupId, date) {
  const ev = events.find(e => e.id === id);
  if (ev) showModal(ev, parseDate(date), ev.time);
}

function saveEvent(id, groupId, instanceDate) {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { alert('请输入日程标题'); return; }
  const date = document.getElementById('evDate').value;
  const time = document.getElementById('evTime').value;
  const color = parseInt(document.getElementById('evColor').value);
  const note = document.getElementById('evNote').value;
  const recType = document.getElementById('evRecType').value;
  const endType = document.getElementById('evEndType').value;
  const endDate = document.getElementById('evEndDate').value;
  const maxCount = parseInt(document.getElementById('evMaxCount').value) || 10;
  const days = Array.from(document.querySelectorAll('#dayChecks input:checked')).map(cb => parseInt(cb.value));

  if ((recType === 'weekly' || recType === 'biweekly') && days.length === 0) {
    alert('请至少选择一个星期'); return;
  }

  if (recType !== 'none') {
    if ((recType === 'weekly' || recType === 'biweekly') && days.length === 0) days.push(new Date(date).getDay());
    if (id) {
      const ev = events.find(e => e.id === id);
      if (ev) {
        ev.title = title; ev.time = time; ev.color = color; ev.note = note;
        ev.startDate = date;
        ev.recurring = { type: recType, days, endType, endDate, maxCount };
      }
    } else {
      const grpId = genId();
      events.push({ id: genId(), groupId: grpId, title, date, time, color, note, startDate: date, recurring: { type: recType, days, endType, endDate, maxCount } });
    }
  } else {
    if (id) {
      const ev = events.find(e => e.id === id);
      if (ev) { ev.title = title; ev.date = date; ev.time = time; ev.color = color; ev.note = note; ev.startDate = date; ev.recurring = { type: 'none' }; }
    } else {
      events.push({ id: genId(), title, date, time, color, note, startDate: date, recurring: { type: 'none' } });
    }
  }

  dirty = true;
  saveLocal();
  closeModal();
  renderTable();
}

function deleteSingle(id, groupId, date) {
  const ev = events.find(e => e.id === id);
  if (ev && ev.recurring) {
    if (!ev.recurring.excludes) ev.recurring.excludes = [];
    ev.recurring.excludes.push(date);
  }
  dirty = true;
  saveLocal();
  closeModal();
  renderTable();
}

function deleteGroup(groupId) {
  if (groupId) events = events.filter(e => e.groupId !== groupId);
  dirty = true;
  saveLocal();
  closeModal();
  renderTable();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  selectedWeek = 0;
  renderAll();
}

</script>
</body>
</html>
